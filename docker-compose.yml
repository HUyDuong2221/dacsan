name: dacsan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dacsan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacsan}
      POSTGRES_DB: ${POSTGRES_DB:-dacsan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dacsan} -d ${POSTGRES_DB:-dacsan}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dacsan}:${POSTGRES_PASSWORD:-dacsan}@db:5432/${POSTGRES_DB:-dacsan}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SEED_DEMO: ${SEED_DEMO:-true}
      MEDIA_DIR: /data/media
      PRIVATE_DIR: /data/private
    volumes:
      - media:/data/media
      - private:/data/private   # bản thảo gửi về, không công khai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"   # chỉ để xem Swagger tại /docs; bỏ dòng này khi production

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  media:
  private:
