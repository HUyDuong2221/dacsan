# Production stack for a single Ubuntu server.
#
#   cp .env.production.example .env.production   # then fill in every value
#   docker compose -f docker-compose.product.yml --env-file .env.production up -d --build
#
# Only Caddy (80/443) is exposed to the internet. Caddy terminates HTTPS (automatic Let's Encrypt
# certificate for $DOMAIN) and routes /api and /media to the backend, everything else to Next.js.
# Postgres and Redis live on an internal network with no route to the outside.
name: dacsan-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dacsan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dacsan}
  CORS_ORIGINS: https://${DOMAIN:?DOMAIN is required}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  MEDIA_ROOT: /app/media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dacsan}
      POSTGRES_USER: ${POSTGRES_USER:-dacsan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dacsan} -d ${POSTGRES_DB:-dacsan}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - mediadata:/app/media
    networks: [internal, web]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Migrations + first admin run on every start (both are idempotent). No demo seed in production.
    # One uvicorn worker on purpose: the login rate limiter keeps its counters in process memory.
    # --proxy-headers makes request.client the real visitor IP (taken from Caddy's X-Forwarded-For),
    # otherwise every visitor would share one rate-limit bucket. Safe because only Caddy can reach this port.
    command: ["sh", "-c", "alembic upgrade head && python -m app.create_admin && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits: {memory: 1g}
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - mediadata:/app/media
    networks: [internal]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 1g}
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin URLs: the browser talks to whatever domain served the page (through Caddy).
        # These are baked in at build time, so changing them requires a rebuild.
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_MEDIA_BASE_URL: /media
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      SERVER_API_BASE_URL: http://backend:8000/api/v1
    networks: [web]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 512m}
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Defaults to the domain (automatic HTTPS). Use http://your.domain to serve plain HTTP behind another proxy/tunnel.
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web, default]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    logging: *logging

  # Daily compressed pg_dump into ./backups, keeping BACKUP_KEEP_DAYS days. Copy that folder off the
  # server too (and back up the mediadata volume: uploaded PDFs and documents are not in the dump).
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dacsan}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-dacsan}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/dacsan-$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f"; else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'dacsan-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging

networks:
  # No route to the outside world: database, Redis and the worker are unreachable from the internet.
  internal:
    internal: true
  web:

volumes:
  pgdata:
  redisdata:
  mediadata:
  caddy_data:
  caddy_config:
