# Cấu hình chạy trên server dev (build sẵn image, không mount code, không hot reload).
# Dùng:   cp .env.server.example .env   (rồi sửa mật khẩu/secret)
#         docker compose -f docker-compose.server.yml up -d --build
# Cập nhật code mới: git pull && docker compose -f docker-compose.server.yml up -d --build
# File docker-compose.yml còn lại chỉ dùng cho máy lập trình (mount code + hot reload).
name: dacsan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dacsan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-dacsan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dacsan} -d ${POSTGRES_DB:-dacsan}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # không mở cổng ra ngoài: chỉ backend truy cập qua mạng nội bộ của compose

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dacsan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dacsan}
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Cần đặt ADMIN_EMAIL trong .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Cần đặt ADMIN_PASSWORD trong .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      FORWARDED_HOPS: ${FORWARDED_HOPS:-1}   # IP thật = phần tử cuối X-Forwarded-For do reverse proxy (nginx/Caddy) ghi; không có reverse proxy thì đặt 0
      SMTP_HOST: ${SMTP_HOST:-}            # để trống: thư chỉ lưu ở Hộp thư đi, không gửi
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}   # starttls | ssl | none
      SITE_URL: ${SITE_URL:-http://localhost:3000}   # địa chỉ website, dùng tạo link trong email
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}   # để trống: không quét mã độc
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}   # false: máy quét lỗi thì từ chối tệp
      BACKUP_DIR: /backups
      MEDIA_DIR: /data/media
      PRIVATE_DIR: /data/private
    volumes:
      - media:/data/media
      - private:/data/private   # bản thảo gửi về, không công khai
      - backups:/backups        # đọc danh sách / tải bản sao lưu; ghi .request để sao lưu ngay
    # Swagger (/docs) chỉ mở trên localhost của server; xem từ máy mình bằng: ssh -L 8000:127.0.0.1:8000 <server>
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # Sao lưu hằng ngày: DB + media + private -> volume backups (xem backup/backup.sh, docs/SAO-LUU.md).
  # Volume backups nằm CÙNG máy: hãy định kỳ tải bản sao lưu về nơi khác (admin > Hệ thống > Sao lưu).
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dacsan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dacsan}
      PGHOST: db
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      BACKUP_AT: ${BACKUP_AT:-02:00}     # giờ chạy hằng ngày (theo TZ)
      BACKUP_KEEP: ${BACKUP_KEEP:-14}    # số bản giữ lại
    volumes:
      - backups:/backups
      - media:/data/media:ro
      - private:/data/private:ro

  # Quét mã độc tệp tải lên (clamd). Cần ~1–1,5GB RAM; lần đầu tải bộ nhận diện mất vài phút.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
      - media:/data/media:ro       # cùng đường dẫn với backend để quét bằng SCAN <path>
      - private:/data/private:ro

  frontend:
    build:
      context: ./frontend
      target: run   # image production: `next build` + node server.js
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  media:
  private:
  backups:
  clamdb:
